name: ChaosArena Resilience Gate

'on':
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience-gate:
    name: Test + release gate (free tier)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show gate safety rules
        run: python -m ci.gate guard

      - name: Run all tests
        run: python -m pytest -q

      - name: Build React dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Self-test - a bad battle must BLOCK
        run: python -m ci.gate check --evidence ci/fixtures/failing_battle.json --threshold 70 --expect BLOCK

      - name: Enforce committed battle - must PROMOTE
        run: python -m ci.gate check --evidence ml/last_battle.json --threshold 70 --expect PROMOTE

      - name: Show audit trail
        if: always()
        continue-on-error: true
        run: python -m controller.cli last

  deep-aiml:
    name: Deep AIML smoke test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-aiml.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-aiml.txt

      - name: Show LLM role configs (keys hidden)
        run: python -m scripts.llm_guard

      - name: Run deep AIML tests
        run: python -m pytest -q tests/test_dqn.py tests/test_neural.py tests/test_strategist.py tests/test_deep_validation.py tests/test_env_loader.py

      - name: Offline LLM role check
        run: python -m scripts.llm_live_check --out /tmp/chaosarena-llm-live.json

      - name: Smoke train DQN and neural defender
        run: |
          python -m rl.train_dqn --episodes 3 --steps 4 --out /tmp/chaosarena-dqn.pt --metrics /tmp/chaosarena-dqn.json
          python -m defender.neural_cli train --epochs 2 --out /tmp/chaosarena-defender.pt
