global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: shopapp
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8100
          - localhost:8101
          - localhost:8102
          - localhost:8103
          - localhost:8104
          - localhost:8090
